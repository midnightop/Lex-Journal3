                ]
            },
            {
                id: "auth4",
                author: "Bishal Soren",
                university: "SURENDRANATH LAW COLLEGE",
                insta: "_aye4x",
                photo: "read/author3.jpg",
                bio: "Analyzing the structural backbone of the Indian Constitution and democratic nation-building.",
                articles: [
                    { title: "Constitutional Framework", desc: "Analyzing the 'Rule of Law' and the structural backbone of our democratic nation.", link: "read/article3.html", date: "19 Apr 2026", time: "13 min", status: "published" }
                ]
            }
        ];

        const container = document.getElementById('articles-hub');
        const modal = document.getElementById('article-modal');
        const searchOverlay = document.getElementById('search-overlay');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        window.onpopstate = function(event) {
            if (searchOverlay.classList.contains('active')) {
                searchOverlay.classList.remove('active');
                searchOverlay.setAttribute('aria-hidden', 'true');
                searchInput.value = "";
            }
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }
        };

        function toggleSearch(show) {
            if (show) {
                window.history.pushState({ searchOpen: true }, "");
                searchOverlay.classList.add('active');
                searchOverlay.setAttribute('aria-hidden', 'false');
                searchInput.focus();
            } else {
                searchOverlay.classList.remove('active');
                searchOverlay.setAttribute('aria-hidden', 'true');
                if (window.history.state && window.history.state.searchOpen) window.history.back();
            }
        }

        function openModal(id) {
            const data = authorData.find(a => a.id === id);
            window.history.pushState({ modalOpen: true }, "");
            document.body.classList.add('modal-open');
            modal.setAttribute('aria-hidden', 'false');
            
            // ✅ Fix: Added alt tags, handled spaced names in avatars, and conditional insta button
            document.getElementById('modal-profile-header').innerHTML = `
                <div class="flex items-center gap-4">
                    <img src="${data.photo}" alt="Profile picture of ${data.author}" loading="lazy" decoding="async" class="w-16 h-16 rounded-2xl object-cover shadow-md" onerror="this.src='https://ui-avatars.com/api/?name=${data.author.replace(/ /g, '+')}'">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h2 class="text-lg font-extrabold text-slate-900">${data.author}</h2>
                            <i class="fa-solid fa-circle-check text-blue-500 text-xs" aria-hidden="true"></i>
                        </div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">${data.university}</p>
                        ${data.insta ? `<a href="https://instagram.com/${data.insta}" target="_blank" rel="noopener noreferrer" class="insta-btn text-[9px] font-bold text-pink-600 bg-pink-50 px-2.5 py-1 rounded-full mt-2 inline-block"><i class="fa-brands fa-instagram mr-1" aria-hidden="true"></i>@${data.insta}</a>` : ''}
                    </div>
                </div>
                <p class="mt-5 text-xs text-slate-500 font-medium leading-relaxed">${data.bio}</p>
            `;

            let html = "";
            data.articles.forEach(art => {
                const isPub = art.status === 'published';
                html += `
                <div class="p-4 ${isPub ? 'bg-slate-50' : 'bg-white border-dashed opacity-60'} rounded-2xl border border-slate-100 mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[8px] font-black text-blue-600 uppercase tracking-widest">${art.date} • ${art.time} read</span>
                        <span class="status-tag uppercase">${isPub ? 'Peer Reviewed' : 'In Review'}</span>
                    </div>
                    <h4 class="text-sm font-bold text-slate-900 my-1">${art.title}</h4>
                    <p class="text-[11px] text-slate-500 mb-3 line-clamp-2 leading-relaxed font-medium">${art.desc}</p>
                    ${isPub ? `<a href="${art.link}" aria-label="Read full article: ${art.title}" class="w-full py-2.5 bg-white border border-slate-200 rounded-lg text-[9px] font-black text-center block uppercase tracking-wider active:bg-blue-600 active:text-white transition-all">Read Article <i class="fa-solid fa-chevron-right text-[7px] ml-1" aria-hidden="true"></i></a>` : ''}
                </div>`;
            });
            document.getElementById('modal-articles-list').innerHTML = html;
            modal.classList.add('active');
        }

        function closeModal() {
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
                if (window.history.state && window.history.state.modalOpen) window.history.back();
            }
        }

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            searchResults.innerHTML = "";
            if(!val) return;

            authorData.forEach(author => {
                author.articles.forEach(art => {
                    if(art.title.toLowerCase().includes(val) || author.author.toLowerCase().includes(val)) {
                        const item = document.createElement('div');
                        item.className = "search-item";
                        // ✅ Fix: Added accessibility for search results
                        item.setAttribute('role', 'button');
                        item.setAttribute('tabindex', '0');
                        item.innerHTML = `
                            <p class="text-[8px] font-black text-blue-600 uppercase tracking-widest">${author.author}</p>
                            <h5 class="text-xs font-bold text-slate-800">${art.title}</h5>
                        `;
                        const triggerItem = () => {
                            searchOverlay.classList.remove('active');
                            openModal(author.id);
                        };
                        item.onclick = triggerItem;
                        item.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerItem(); } };
                        searchResults.appendChild(item);
                    }
                });
            });
        });

        const render = () => {
            container.innerHTML = "";
            authorData.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = `premium-card p-5`;
                // ✅ Fix: Added keyboard accessibility to cards
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Open profile and articles by ${data.author}`);
                
                const triggerModal = () => openModal(data.id);
                card.onclick = triggerModal;
                card.onkeydown = (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerModal(); } };

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2.5">
                            <img src="${data.photo}" alt="${data.author}" loading="lazy" decoding="async" class="w-11 h-11 rounded-xl object-cover shadow-sm" onerror="this.src='https://ui-avatars.com/api/?name=${data.author.replace(/ /g, '+')}'">
                            <div>
                                <div class="flex items-center gap-1">
                                    <h4 class="font-bold text-slate-900 text-[13px] tracking-tight">${data.author}</h4>
                                    <i class="fa-solid fa-circle-check text-blue-500 text-[10px]" aria-hidden="true"></i>
                                </div>
                                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">${data.university}</p>
                            </div>
                        </div>
                        <div class="count-badge">0${data.articles.length}<br><span class="text-[7px] opacity-60 uppercase">Papers</span></div>
                    </div>
                    <div class="mb-4">
                        <h3 class="text-[16px] font-extrabold text-slate-900 leading-tight mb-1 tracking-tight">${data.articles[0].title}</h3>
                        <p class="text-[11px] text-slate-500 font-medium leading-relaxed line-clamp-2">${data.articles[0].desc}</p>
                    </div>
                    <div class="action-link">View Portfolio <i class="fa-solid fa-arrow-right text-[9px]" aria-hidden="true"></i></div>
                `;
                container.appendChild(card);
                setTimeout(() => card.classList.add('show'), index * 120);
            });
        };

        window.onload = render;
        window.onclick = (e) => { if (e.target == modal) closeModal(); };
    </script>
