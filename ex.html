<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigHub Kolkata - Elite Job Marketplace Prototype</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Premium UI Utility Styles */
        .glassmorphism {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Card Swiping Physics Classes */
        .swipe-right-anim {
            transform: translate(200%, 50px) rotate(35deg) !important;
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .swipe-left-anim {
            transform: translate(-200%, 50px) rotate(-35deg) !important;
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .card-stack-transition {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        /* Custom Scrollbar for Smooth Feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-hidden selection:bg-amber-500 selection:text-slate-950">

    <!-- Global State Header -->
    <header class="w-full max-w-md mx-auto px-4 pt-4 pb-2 z-30">
        <div class="glassmorphism rounded-2xl p-3 flex justify-between items-center shadow-2xl">
            <!-- App Identity -->
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/20">
                    <i class="fa-solid fa-fire-lightning text-slate-950 text-sm"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">GIGHUB</h1>
                    <p class="text-[10px] text-amber-400 font-bold tracking-tight uppercase"><i class="fa-solid fa-location-crosshairs mr-0.5"></i> Kolkata Core</p>
                </div>
            </div>

            <!-- Profile Dual Switcher Engine -->
            <div class="bg-slate-900/90 p-1 rounded-xl flex border border-slate-800 relative w-44">
                <button id="toggle-work" onclick="engine.switchMode('work')" class="w-1/2 py-1 text-[11px] font-black rounded-lg z-10 transition-all duration-300 flex items-center justify-center gap-1 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md">
                    <i class="fa-solid fa-user-astronaut"></i> Work
                </button>
                <button id="toggle-hire" onclick="engine.switchMode('hire')" class="w-1/2 py-1 text-[11px] font-black rounded-lg z-10 text-slate-400 transition-all duration-300 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-building-columns"></i> Hire
                </button>
            </div>
        </div>

        <!-- Real-Time Gamification Live Status Bar -->
        <div class="mt-2 px-1 flex justify-between items-center text-[11px]">
            <div class="flex items-center gap-1.5 text-slate-400 bg-slate-900/40 px-2 py-0.5 rounded-md border border-slate-800/60">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>User: <strong class="text-slate-200">Aktar Anjum</strong></span>
            </div>
            <div id="reputation-badge" class="bg-slate-900/40 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-bold">
                <i class="fa-solid fa-crown text-[10px]"></i> Elite Rank (4.9★)
            </div>
        </div>
    </header>

    <!-- Main Deck / Interaction Arena -->
    <main class="flex-1 w-full max-w-md mx-auto flex items-center justify-center relative px-4 z-20">
        
        <!-- Live Match Celebration Portal -->
        <div id="match-portal" class="hidden absolute inset-0 z-50 glassmorphism rounded-3xl m-4 flex flex-col items-center justify-center p-6 text-center animate-fade-in border border-emerald-500/30">
            <div class="w-20 h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-full flex items-center justify-center text-3xl shadow-2xl shadow-green-500/40 animate-bounce mb-4">
                🤝
            </div>
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 tracking-tight">IT'S A MATCH!</h2>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Kolkata Fast-Track Node</p>
            
            <p id="match-details" class="text-sm text-slate-300 my-5 bg-slate-900/60 p-4 rounded-xl border border-slate-800 max-w-xs leading-relaxed"></p>
            
            <!-- Real-time UPI Match Action Handlers -->
            <div class="flex flex-col gap-2 w-full max-w-xs">
                <button onclick="engine.initiateInstantChat()" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black py-3 rounded-xl text-xs tracking-wider uppercase shadow-xl hover:opacity-90 transition active:scale-95">
                    <i class="fa-solid fa-comments mr-1"></i> Open Instant Chat Node
                </button>
                <button onclick="engine.closeMatchPortal()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold transition">
                    Keep Swiping Market
                </button>
            </div>
        </div>

        <!-- The Dynamic Card Deck Insertion Anchor -->
        <div id="deck-anchor" class="relative w-full h-[460px] flex items-center justify-center">
            <!-- Cards are structurally rendered and managed dynamically via State Machine Engine -->
        </div>
    </main>

    <!-- Professional Control System Grid -->
    <footer class="w-full max-w-md mx-auto p-4 z-30 flex flex-col gap-3">
        <!-- Live Global Metrics Deck Tracker -->
        <div class="grid grid-cols-3 gap-2 bg-slate-900/50 p-2 rounded-xl border border-slate-800 text-center text-[10px]">
            <div class="border-r border-slate-800">
                <p class="text-slate-500 uppercase tracking-wider">Swipes Left</p>
                <p id="stat-swipes" class="text-slate-200 font-bold text-xs mt-0.5">0</p>
            </div>
            <div class="border-r border-slate-800">
                <p class="text-slate-500 uppercase tracking-wider">Total XP</p>
                <p id="stat-xp" class="text-amber-400 font-bold text-xs mt-0.5">1,250</p>
            </div>
            <div>
                <p class="text-slate-500 uppercase tracking-wider">Node Active</p>
                <p class="text-emerald-400 font-bold text-xs mt-0.5 flex items-center justify-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> 42 Gigs
                </p>
            </div>
        </div>

        <!-- Control Action Interface -->
        <div class="flex justify-between items-center px-4">
            <!-- Dislike Trigger -->
            <button onclick="engine.executeManualSwipe('left')" class="w-14 h-14 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-500 rounded-full flex items-center justify-center text-xl shadow-xl transition transform active:scale-90 group">
                <i class="fa-solid fa-xmark group-hover:rotate-90 transition duration-200"></i>
            </button>
            
            <!-- Hyper-Local 3km SOS Surge Price Activation Node -->
            <button onclick="engine.triggerUrgentSosAlert()" class="h-11 px-5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-full flex items-center justify-center gap-2 text-xs font-black tracking-widest shadow-lg transition transform active:scale-95 uppercase">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                ⚡ SOS Surge
            </button>
            
            <!-- Like Trigger -->
            <button onclick="engine.executeManualSwipe('right')" class="w-14 h-14 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-emerald-400 rounded-full flex items-center justify-center text-xl shadow-xl transition transform active:scale-90 group">
                <i class="fa-solid fa-heart group-hover:scale-125 transition duration-200"></i>
            </button>
        </div>
    </footer>

    <!-- Full-Scale Monolithic State Machine & API Integration Layer -->
    <script>
        class GigHubCoreEngine {
            constructor() {
                // Real-world localized Kolkata Mock Database Structures
                this.jobGigsData = [
                    { id: 101, title: "Specialist Barista", entity: "Roastery Coffee House", location: "Gariahat", basePay: 180, multiplier: 1.5, timing: "Sat-Sun (4 PM - 10 PM)", tag: "Verified Barista", isUrgent: true },
                    { id: 102, title: "Academic Manuscript Cataloger", entity: "Dasgupta Publishers", location: "College Street", basePay: 150, multiplier: 1.0, timing: "Flexible 4hr Window", tag: "Data Entry Pro", isUrgent: false },
                    { id: 103, title: "Visual Reel Content Director", entity: "Sienna Store & Cafe", location: "Hindustan Park", basePay: 250, multiplier: 1.5, timing: "Instant Gig (3 Hours)", tag: "Reel Creator", isUrgent: true },
                    { id: 104, title: "Premium Stall Manager", entity: "Artisanal Guild Exhibition", location: "Milan Mela Complex", basePay: 140, multiplier: 1.0, timing: "Full Day Expo Shift", tag: "Weekend Sales Pro", isUrgent: false },
                    { id: 105, title: "Late Night Operations Crew", entity: "Flurys Patisserie", location: "Park Street", basePay: 200, multiplier: 1.0, timing: "Fri-Sat (8 PM - 2 AM)", tag: "Trusted Editor", isUrgent: false }
                ];

                this.applicantStudentsData = [
                    { id: 201, name: "Subham Dey", institute: "Jadavpur University", metric: "4.9 ★", geolocation: "0.8 km away (Hazra Route)", tag: "Verified Barista", history: "14 Successful Shifts" },
                    { id: 202, name: "Ananya Sen", institute: "Asutosh College", metric: "4.7 ★", geolocation: "1.4 km away (Metro Line)", tag: "Reel Creator", history: "8 Successful Shifts" },
                    { id: 203, name: "Rohan Das", institute: "Calcutta University", metric: "4.8 ★", geolocation: "2.5 km away (College St Node)", tag: "Weekend Sales Pro", history: "22 Successful Shifts" },
                    { id: 204, name: "Priya Chakraborty", institute: "St. Xavier's College", metric: "5.0 ★", geolocation: "0.4 km away (Park St Hub)", tag: "Trusted Editor", history: "31 Successful Shifts" }
                ];

                // Runtime State Containers
                this.currentMode = 'work'; // 'work' = Looking for job, 'hire' = Looking for student
                this.pointerIndex = 0;
                this.activeDataset = [...this.jobGigsData];
                
                // Track Analytics Variables locally
                this.statistics = { totalSwipes: 0, accumulatedXp: 1250 };
            }

            init() {
                this.renderActiveDeck();
                this.updateStatisticsPanel();
            }

            switchMode(selectedMode) {
                if (this.currentMode === selectedMode) return;
                this.currentMode = selectedMode;
                this.pointerIndex = 0;
                this.activeDataset = (selectedMode === 'work') ? [...this.jobGigsData] : [...this.applicantStudentsData];
                
                const btnWork = document.getElementById('toggle-work');
                const btnHire = document.getElementById('toggle-hire');
                
                if (selectedMode === 'work') {
                    btnWork.className = "w-1/2 py-1 text-[11px] font-black rounded-lg z-10 transition-all duration-300 flex items-center justify-center gap-1 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md";
                    btnHire.className = "w-1/2 py-1 text-[11px] font-black rounded-lg z-10 text-slate-400 transition-all duration-300 flex items-center justify-center gap-1";
                } else {
                    btnHire.className = "w-1/2 py-1 text-[11px] font-black rounded-lg z-10 transition-all duration-300 flex items-center justify-center gap-1 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-md";
                    btnWork.className = "w-1/2 py-1 text-[11px] font-black rounded-lg z-10 text-slate-400 transition-all duration-300 flex items-center justify-center gap-1";
                }
                
                this.renderActiveDeck();
            }

            renderActiveDeck() {
                const anchor = document.getElementById('deck-anchor');
                anchor.innerHTML = '';

                if (this.pointerIndex >= this.activeDataset.length) {
                    anchor.innerHTML = `
                        <div class="text-center p-6 bg-slate-900/40 rounded-2xl border border-slate-800 max-w-xs animate-fade-in">
                            <div class="w-12 h-12 rounded-full bg-slate-800/80 mx-auto flex items-center justify-center text-slate-600 mb-3 border border-slate-700">
                                <i class="fa-solid fa-database text-lg"></i>
                            </div>
                            <h3 class="text-sm font-bold text-slate-300">End of Local Node Data</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Expanding query parameters or wait for real-time location ping updates.</p>
                        </div>`;
                    return;
                }

                // Render 2 stacked cards to maximize look and feel depth
                for (let step = this.pointerIndex + 1; step >= this.pointerIndex; step--) {
                    if (step >= this.activeDataset.length) continue;
                    
                    const packet = this.activeDataset[step];
                    const isTopmost = (step === this.pointerIndex);
                    
                    const cardInstance = document.createElement('div');
                    cardInstance.className = `absolute w-full h-full bg-gradient-to-b from-slate-800/95 to-slate-900/95 border border-slate-700/60 rounded-3xl p-5 flex flex-col justify-between shadow-2xl card-stack-transition transform origin-bottom ${
                        isTopmost ? 'z-20 scale-100 opacity-100 pointer-events-auto' : 'z-10 scale-95 opacity-40 translate-y-4 pointer-events-none'
                    }`;
                    
                    if (this.currentMode === 'work') {
                        const trueRate = Math.round(packet.basePay * packet.multiplier);
                        cardInstance.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md ${
                                        packet.isUrgent ? 'bg-red-500/10 text-red-400 border border-red-500/20 animate-pulse' : 'bg-slate-950 text-slate-400 border border-slate-800'
                                    }">
                                        ${packet.isUrgent ? '🔥 SOS SURGE' : 'Verified Gig'}
                                    </span>
                                    <div class="text-right">
                                        <span class="text-lg font-black text-emerald-400">₹${trueRate}/hr</span>
                                        ${packet.isUrgent ? `<p class="text-[9px] text-rose-400 font-bold line-through">₹${packet.basePay}</p>` : ''}
                                    </div>
                                </div>
                                
                                <h3 class="text-xl font-black mt-5 text-slate-100 tracking-tight leading-snug">${packet.title}</h3>
                                <p class="text-xs text-amber-400 font-medium flex items-center gap-1.5 mt-1.5">
                                    <i class="fa-solid fa-mug-hot text-[10px]"></i> ${packet.entity}
                                </p>

                                <div class="mt-6 space-y-1.5">
                                    <div class="flex items-center gap-2.5 text-[11px] text-slate-300 bg-slate-950/40 p-2.5 rounded-xl border border-slate-900">
                                        <i class="fa-solid fa-map-pin text-orange-500 w-3 text-center"></i>
                                        <span>${packet.location}, Kolkata Node</span>
                                    </div>
                                    <div class="flex items-center gap-2.5 text-[11px] text-slate-300 bg-slate-950/40 p-2.5 rounded-xl border border-slate-900">
                                        <i class="fa-solid fa-business-time text-sky-400 w-3 text-center"></i>
                                        <span>${packet.timing}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-slate-800 pt-4 flex justify-between items-center text-[11px]">
                                <span class="text-slate-500 font-medium">Target Competency:</span>
                                <span class="font-black bg-slate-950 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-lg flex items-center gap-1">
                                    <i class="fa-solid fa-award text-[10px]"></i> ${packet.tag}
                                </span>
                            </div>`;
                    } else {
                        // RECRUITER MODE VIEWPORT
                        cardInstance.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start">
                                    <span class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                        <i class="fa-solid fa-circle-check mr-0.5"></i> ${packet.history}
                                    </span>
                                    <span class="text-xs font-black bg-slate-950 px-2.5 py-1 rounded-lg text-amber-400 border border-slate-800 flex items-center gap-1">
                                        <i class="fa-solid fa-star text-[9px]"></i> ${packet.metric}
                                    </span>
                                </div>
                                
                                <h3 class="text-xl font-black mt-5 text-slate-100 tracking-tight leading-snug">${packet.name}</h3>
                                <p class="text-xs text-indigo-400 font-medium flex items-center gap-1.5 mt-1.5">
                                    <i class="fa-solid fa-building-columns text-[10px]"></i> ${packet.institute}
                                </p>

                                <div class="mt-6 space-y-1.5">
                                    <div class="flex items-center gap-2.5 text-[11px] text-slate-300 bg-slate-950/40 p-2.5 rounded-xl border border-slate-900">
                                        <i class="fa-solid fa-location-arrow text-emerald-500 w-3 text-center"></i>
                                        <span>${packet.geolocation}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-slate-800 pt-4 flex justify-between items-center text-[11px]">
                                <span class="text-slate-500 font-medium">Verified Attribute:</span>
                                <span class="font-black bg-slate-950 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-lg flex items-center gap-1">
                                    <i class="fa-solid fa-shield-halved text-[10px]"></i> ${packet.tag}
                                </span>
                            </div>`;
                    }
                    anchor.appendChild(cardInstance);
                }
            }

            executeManualSwipe(direction) {
                if (this.pointerIndex >= this.activeDataset.length) return;

                const cardCollection = document.getElementById('deck-anchor').children;
                // Get the topmost processing DOM instance
                let targetedDomNode = null;
                for (let i = 0; i < cardCollection.length; i++) {
                    if (cardCollection[i].classList.contains('z-20')) {
                        targetedDomNode = cardCollection[i];
                        break;
                    }
                }

                if (!targetedDomNode) return;

                // Fire custom animations
                if (direction === 'right') {
                    targetedDomNode.classList.add('swipe-right-anim');
                    this.statistics.accumulatedXp += 75; // Reward operational XP points
                    
                    // Simulate production matching probability matrix (approx 50% rate)
                    if (Math.random() > 0.45) {
                        const isolatedMatchData = this.activeDataset[this.pointerIndex];
                        setTimeout(() => this.triggerMatchPortalOverlay(isolatedMatchData), 350);
                    }
                } else {
                    targetedDomNode.classList.add('swipe-left-anim');
                }

                this.statistics.totalSwipes++;
                this.pointerIndex++;
                
                // Track update pipelines
                this.updateStatisticsPanel();
                setTimeout(() => this.renderActiveDeck(), 400);
            }

            triggerMatchPortalOverlay(matchedObject) {
                const overlay = document.getElementById('match-portal');
                const textArea = document.getElementById('match-details');
                
                if (this.currentMode === 'work') {
                    textArea.innerHTML = `Your application profile has been instant-matched with <strong>${matchedObject.entity}</strong> for the role of <strong>${matchedObject.title}</strong> in ${matchedObject.location}. Payout tier setup successfully optimized.`;
                } else {
                    textArea.innerHTML = `Operational match locked with student researcher <strong>${matchedObject.name}</strong> from <strong>${matchedObject.institute}</strong>. They passed proximity metrics configuration checks.`;
                }
                overlay.classList.remove('hidden');
            }

            closeMatchPortal() {
                document.getElementById('match-portal').classList.add('hidden');
            }

            initiateInstantChat() {
                alert("Opening End-to-End WebSocket Secure Chat Engine via Supabase Real-Time Channel Router...");
                this.closeMatchPortal();
            }

            triggerUrgentSosAlert() {
                alert("System Notice: Broadcasted Hyper-Local SOS Surge Request Matrix across 3km geofence radius. Multiplier configured to 1.5x payout rate.");
                this.statistics.accumulatedXp += 150;
                this.updateStatisticsPanel();
            }

            updateStatisticsPanel() {
                document.getElementById('stat-swipes').innerText = this.statistics.totalSwipes;
                document.getElementById('stat-xp').innerText = this.statistics.accumulatedXp.toLocaleString();
            }
        }

        // Initialize core component framework architecture engine
        const engine = new GigHubCoreEngine();
        document.addEventListener('DOMContentLoaded', () => engine.init());
    </script>
</body>
</html>
