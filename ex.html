<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigSwipe Kolkata - Tinder for Part-Time Jobs</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Card Swiping Animations */
        .swipe-right {
            transform: translate(150%, -20px) rotate(20deg) !important;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }
        .swipe-left {
            transform: translate(-150%, -20px) rotate(-20deg) !important;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }
        .card-transition {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between overflow-hidden">

    <header class="p-4 bg-slate-800 border-b border-slate-700 flex flex-col items-center gap-3 shadow-md z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-yellow-400 text-2xl animate-pulse"></i>
            <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">GIGSWIPE</h1>
            <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-300 font-semibold">Kolkata</span>
        </div>
        
        <div class="bg-slate-950 p-1 rounded-full flex relative w-64 border border-slate-700">
            <button id="btn-work" onclick="switchMode('work')" class="w-1/2 py-1.5 text-xs font-bold rounded-full z-10 transition-all duration-300 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-950">
                <i class="fa-solid fa-briefcase mr-1"></i> Find Work
            </button>
            <button id="btn-hire" onclick="switchMode('hire')" class="w-1/2 py-1.5 text-xs font-bold rounded-full z-10 text-slate-400 transition-all duration-300">
                <i class="fa-solid fa-users mr-1"></i> Hire Staff
            </button>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center relative px-4">
        <div id="match-popup" class="hidden absolute inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center text-center p-6 animate-fade-in">
            <div class="text-6xl mb-4 animate-bounce">🎉</div>
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500">IT'S A MATCH!</h2>
            <p id="match-text" class="text-slate-300 my-4 max-w-xs text-sm"></p>
            <div class="flex gap-3 w-full max-w-xs mt-2">
                <button onclick="closeMatch()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-600 py-3 rounded-xl font-bold text-sm">Keep Swiping</button>
                <button onclick="alert('Chat feature coming soon in main build!')" class="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-green-500/20">Chat on UPI</button>
            </div>
        </div>

        <div id="card-deck" class="relative w-full max-w-sm h-[460px] flex items-center justify-center">
            </div>
    </main>

    <footer class="p-6 bg-gradient-to-t from-slate-950 to-transparent flex justify-center items-center gap-6 z-10">
        <button onclick="swipe('left')" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-red-500 rounded-full flex items-center justify-center text-xl shadow-lg transition transform active:scale-90">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button onclick="alert('SOS Instant Alert sent to nearest 3km radius!')" class="w-12 h-12 bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 text-yellow-400 rounded-full flex items-center justify-center text-sm font-bold shadow-md transition transform active:scale-90">
            ⚡ SOS
        </button>
        <button onclick="swipe('right')" class="w-14 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-green-400 rounded-full flex items-center justify-center text-xl shadow-lg transition transform active:scale-90">
            <i class="fa-solid fa-heart"></i>
        </button>
    </footer>

    <script>
        // Mock Data for Kolkata Market
        const jobCards = [
            { id: 1, title: "Weekend Barista", company: "Roastery Cafe", loc: "Gariahat", pay: "₹180/hr", time: "Sat-Sun (4PM - 10PM)", badge: "Verified Barista", urgent: true },
            { id: 2, title: "Book Cataloger", company: "Dasgupta Publishers", loc: "College Street", pay: "₹600/Day", time: "Flexible 4 Hours", badge: "Data Entry Pro", urgent: false },
            { id: 3, title: "Reel Content Creator", company: "The Tribe Cafe", loc: "Salt Lake Sec V", pay: "₹1,500/Gig", time: "Instant (2 Hours)", badge: "Reel Creator", urgent: true },
            { id: 4, title: "Stall Sales Executive", company: "Handloom Expo", loc: "Milan Mela", pay: "₹1,000/Day", time: "Full Day Shift", badge: "Weekend Sales Pro", urgent: false }
        ];

        const studentCards = [
            { id: 1, name: "Subham Dey", college: "Jadavpur University", score: "4.9 ★", distance: "1.2 km away", badge: "Verified Barista", shifts: "14 Shifts Done" },
            { id: 2, name: "Ananya Sen", college: "Asutosh College", score: "4.7 ★", distance: "0.8 km away", badge: "Reel Creator", shifts: "8 Shifts Done" },
            { id: 3, name: "Rohan Das", college: "Calcutta University", score: "4.8 ★", distance: "2.5 km away", badge: "Weekend Sales Pro", shifts: "22 Shifts Done" }
        ];

        let currentMode = 'work'; // Default Mode
        let currentIndex = 0;
        let activeData = [...jobCards];

        function renderDeck() {
            const deck = document.getElementById('card-deck');
            deck.innerHTML = '';
            
            if (currentIndex >= activeData.length) {
                deck.innerHTML = `<div class="text-center text-slate-500 font-medium">
                                    <i class="fa-solid fa-circle-check text-4xl text-slate-700 mb-2 block"></i>
                                    No more cards nearby!<br><span class="text-xs">Try switching modes or widening radius.</span>
                                  </div>`;
                return;
            }

            // Render top 2 cards for stacking effect
            for (let i = currentIndex + 1; i >= currentIndex; i--) {
                if (i >= activeData.length) continue;
                const item = activeData[i];
                const isTopCard = (i === currentIndex);
                
                const card = document.createElement('div');
                card.className = `absolute w-full h-full bg-slate-800 rounded-3xl border border-slate-700 p-6 flex flex-col justify-between shadow-2xl card-transition transform origin-bottom ${isTopCard ? 'z-20 scale-100 opacity-100' : 'z-10 scale-95 opacity-50 translate-y-4'}`;
                card.id = `card-${item.id}`;

                if (currentMode === 'work') {
                    // JOB CARD UI
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold tracking-wide uppercase px-2.5 py-1 rounded-md ${item.urgent ? 'bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse' : 'bg-blue-500/20 text-blue-400'}">
                                    ${item.urgent ? '🔥 URGENT (1.5x)' : 'Part-Time'}
                                </span>
                                <span class="text-xl font-black text-emerald-400">${item.pay}</span>
                            </div>
                            <h2 class="text-2xl font-black mt-4 text-white leading-tight">${item.title}</h2>
                            <p class="text-slate-400 text-sm font-semibold flex items-center gap-1 mt-1">
                                <i class="fa-solid fa-store text-xs text-yellow-500"></i> ${item.company}
                            </p>
                            
                            <div class="mt-6 space-y-2">
                                <div class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900/50 p-2 rounded-lg">
                                    <i class="fa-solid fa-location-dot text-orange-500 w-4"></i>
                                    <span>${item.loc}, Kolkata</span>
                                </div>
                                <div class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900/50 p-2 rounded-lg">
                                    <i class="fa-solid fa-clock text-blue-400 w-4"></i>
                                    <span>${item.time}</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-slate-700/60 pt-4 flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">Prefers Tag:</span>
                            <span class="text-xs font-bold bg-slate-950 text-yellow-400 border border-yellow-500/20 px-2.5 py-1 rounded-full"><i class="fa-solid fa-award"></i> ${item.badge}</span>
                        </div>
                    `;
                } else {
                    // STUDENT APPLICANT CARD UI
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-md">
                                    ${item.shifts}
                                </span>
                                <span class="text-sm font-black bg-slate-950 px-2.5 py-1 rounded-full text-yellow-400 border border-slate-700 flex items-center gap-1">${item.score}</span>
                            </div>
                            <h2 class="text-2xl font-black mt-4 text-white leading-tight">${item.name}</h2>
                            <p class="text-slate-400 text-sm font-semibold flex items-center gap-1 mt-1">
                                <i class="fa-solid fa-graduation-cap text-xs text-indigo-400"></i> ${item.college}
                            </p>
                            
                            <div class="mt-6 space-y-2">
                                <div class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900/50 p-2 rounded-lg">
                                    <i class="fa-solid fa-street-view text-orange-500 w-4"></i>
                                    <span>${item.distance} (Nearest Metro)</span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-slate-700/60 pt-4 flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">Unlocked Badge:</span>
                            <span class="text-xs font-bold bg-slate-950 text-yellow-400 border border-yellow-500/20 px-2.5 py-1 rounded-full"><i class="fa-solid fa-shield-halved"></i> ${item.badge}</span>
                        </div>
                    `;
                }
                deck.appendChild(card);
            }
        }

        function swipe(direction) {
            if (currentIndex >= activeData.length) return;
            
            const topCard = document.querySelector('#card-deck .z-20');
            if (!topCard) return;

            if (direction === 'right') {
                topCard.classList.add('swipe-right');
                // Simulate a 50% chance of a "Match" for interactive proto feel
                if (Math.random() > 0.4) {
                    setTimeout(() => {
                        const matchedItem = activeData[currentIndex - 1]; 
                        document.getElementById('match-text').innerText = currentMode === 'work' 
                            ? `You and ${matchedItem.company} swiped right on each other! They need you today.`
                            : `You and ${matchedItem.name} matched! Ready to start the shift?`;
                        document.getElementById('match-popup').classList.remove('hidden');
                    }, 400);
                }
            } else {
                topCard.classList.add('swipe-left');
            }

            currentIndex++;
            setTimeout(renderDeck, 300);
        }

        function closeMatch() {
            document.getElementById('match-popup').classList.add('hidden');
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            currentIndex = 0;
            activeData = (mode === 'work') ? [...jobCards] : [...studentCards];
            
            // Adjust toggle button styles
            const btnWork = document.getElementById('btn-work');
            const btnHire = document.getElementById('btn-hire');
            
            if (mode === 'work') {
                btnWork.className = "w-1/2 py-1.5 text-xs font-bold rounded-full z-10 transition-all duration-300 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-950";
                btnHire.className = "w-1/2 py-1.5 text-xs font-bold rounded-full z-10 text-slate-400 transition-all duration-300";
            } else {
                btnHire.className = "w-1/2 py-1.5 text-xs font-bold rounded-full z-10 transition-all duration-300 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-950";
                btnWork.className = "w-1/2 py-1.5 text-xs font-bold rounded-full z-10 text-slate-400 transition-all duration-300";
            }
            renderDeck();
        }

        // Initialize Deck on Load
        renderDeck();
    </script>
</body>
</html>
