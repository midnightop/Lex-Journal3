<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Hum yahan ek sundar cursive font use kar rahe hain -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d; /* Dark theme so colors pop */
            font-family: 'Pacifico', cursive;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            perspective: 1000px;
            z-index: 10;
        }

        .hbd-text {
            font-size: 6rem;
            margin: 0;
            padding: 0 20px;
            color: transparent;
            /* Colorful Animated Gradient */
            background-image: linear-gradient(
                to right, 
                #ff0055, #ffaa00, #00ffaa, #00aaff, #aa00ff, #ff0055
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            /* Combine two animations: The color flow and the entry bounce */
            animation: 
                dropIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                shine 3s linear infinite;
            opacity: 0;
            filter: drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.2));
        }

        /* Gradient Color Shifting Animation */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* 3D Entry Animation */
        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-80px) scale(0.7) rotateX(-40deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
            }
        }

        /* Chote chamakte sitare (Sparkles) ka style */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
            animation: twinkle 2s infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0.8; }
        }

        /* Mobile screen ke liye adjustment */
        @media (max-width: 600px) {
            .hbd-text {
                font-size: 3.5rem;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="hbd-text">Happy Birthday!</h1>
    </div>

    <!-- Background mein halke-halke sitare laane ke liye thoda sa JavaScript -->
    <script>
        for(let i = 0; i < 30; i++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            // Random position set karna
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.left = Math.random() * 100 + 'vw';
            // Random animation delay taaki sab ek sath na chamke
            sparkle.style.animationDelay = (Math.random() * 2) + 's';
            // Random colors (pink, blue, yellow)
            let colors = ['#ff0055', '#00aaff', '#ffaa00', '#ffffff'];
            sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.boxShadow = `0 0 10px ${sparkle.style.backgroundColor}`;
            
            document.body.appendChild(sparkle);
        }
    </script>

</body>
</html>
